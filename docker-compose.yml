services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password   # move to .env before this touches real data
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: ./ingestion
    container_name: rag_ingestion
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sample_docs:/data/source
      - ./processed:/data/processed
      - ./manifest.json:/data/manifest.json
    # Runs once and exits — re-run manually with: docker compose run ingestion
    # (not "up", since this isn't a long-lived service yet)

volumes:
  pgdata:
