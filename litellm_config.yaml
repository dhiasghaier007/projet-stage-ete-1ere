model_list:
  - model_name: classifier-local
    litellm_params:
      model: ollama/qwen3.6
      api_base: http://192.168.36.1:11434

  - model_name: classifier-gemini
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    rpm: 15

  - model_name: classifier-gpt
    litellm_params:
      model: gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  fallbacks:
    - classifier-local: ["classifier-gemini", "classifier-gpt"]
  num_retries: 1
  timeout: 180